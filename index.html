<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DaF A1 – Kapitel 4: Intensiv-Training (30 Aufgaben)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --border: #e2e8f0;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --ok-border: #86efac;
      --err: #b91c1c;
      --err-bg: #fef2f2;
      --err-border: #fca5a5;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 16px;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
    }

    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .school-logo {
      height: 52px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
      border-radius: 6px;
    }

    .badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.35rem;
      color: #0f172a;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .stimulus-box {
      background: var(--surface-soft);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.96rem;
    }

    .stimulus-title {
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .audio-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .audio-btn:hover { background: var(--primary-hover); }

    .question-text {
      font-size: 1.12rem;
      font-weight: 700;
      margin: 0 0 16px 0;
      color: #0f172a;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.98rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      font-weight: 700;
      min-width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #f1f5f9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-btn.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
      color: #14532d;
    }

    .option-btn.correct .option-letter {
      background: var(--ok);
      color: #ffffff;
    }

    .option-btn.wrong {
      border-color: var(--err);
      background: var(--err-bg);
      color: #7f1d1d;
    }

    .option-btn.wrong .option-letter {
      background: var(--err);
      color: #ffffff;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.94rem;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.ok {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      color: #14532d;
    }
    .feedback.err {
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: #7f1d1d;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
    .btn-secondary:disabled { opacity: 0.45; cursor: default; }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .stat-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 4px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .filter-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: #334155;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    @media (max-width: 540px) {
      .card, .header { padding: 16px; }
      .question-text { font-size: 1.03rem; }
    }
  </style>
</head>

    <div class="header">

  <script>

        audioText: null,
        q: "2. Warum spricht Beatrice so gut Deutsch?",
        options: [
          "Weil sie in Deutschland Deutschunterricht gibt.",
          "Weil sie jeden Tag Deutsch spricht und viel deutsche Literatur liest.",
          "Weil ihre Kollegen in Künzelsau nur Spanisch sprechen.",
          "Weil sie am Wochenende immer zu Hause bleibt."

        answer: 1,
        explanation: "Im Text nennt Beatrice zwei Gründe: Sie spricht täglich Deutsch (bei der Arbeit und mit Freunden) und liest sehr viel."

      },
      {
        module: "Leseverstehen",
        stimulusTitle: "Lesetext 2 • Leopolds Berufsbiografie",
        stimulusText: "Leopold sagt: „Nächste Woche spiele ich einen Koch. Das ist ein kurzer TV-Spot für eine Pastafirma.“",
        audioText: null,

      },
      {
        module: "Leseverstehen",
        stimulusTitle: "Lesetext 4 • Kurznachricht auf dem Handy",
        stimulusText: "„Hi Leopold! Am Donnerstag (16.05.) ist Kinostart von ‚Victoria‘. Möchtest du am Samstag mit Ulla und mir ins Kino gehen?“ – „Hi! Am Samstag (18.05.) kann ich leider nicht, da ist Premiere. Aber wir können den Film am 20.05. ansehen.“ – „Sorry, vom 19. bis zum 23. geht es bei mir nicht, aber am Freitag, also am 24.05., habe ich Zeit! Wir sehen uns schon am Samstag bei der Premiere um 20 Uhr.“",

    let activeModule = "all";
    let filteredQuestions = [...questions];
    let currentIndex = 0;
    let userAnswers = new Map();

    const quizCard = document.getElementById("quiz-card");
    const progressLabel = document.getElementById("progress-label");
    const progressPct = document.getElementById("progress-pct");
    const progressFill = document.getElementById("progress-fill");
    const scorePill = document.getElementById("score-pill");

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        alert("Ihr Browser unterstützt leider keine Sprachausgabe. Bitte lesen Sie das Transkript.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "de-DE";
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function updateHeader() {
      let correctCount = 0;
      userAnswers.forEach((selectedIdx, qObj) => {
        if (selectedIdx === qObj.answer) correctCount++;
      });
      scorePill.textContent = `Punkte: ${correctCount} / ${questions.length}`;

      const total = filteredQuestions.length;
      if (currentIndex >= total) {
        progressLabel.textContent = `Auswertung (${total} Aufgaben)`;
        progressPct.textContent = "100 %";
        progressFill.style.width = "100%";
      } else {
        const pct = Math.round(((currentIndex + 1) / total) * 100);
        progressLabel.textContent = `Aufgabe ${currentIndex + 1} von ${total}`;
        progressPct.textContent = `${pct} %`;
        progressFill.style.width = `${pct}%`;
      }
    }

    function renderQuestion() {
      updateHeader();
      if (currentIndex >= filteredQuestions.length) {
        renderSummary();
        return;
      }

      const item = filteredQuestions[currentIndex];
      const answered = userAnswers.has(item);
      const selectedIdx = userAnswers.get(item);
      const letters = ["A", "B", "C", "D"];

      let stimulusHtml = "";
      if (item.stimulusText || item.audioText) {
        stimulusHtml = `
          <div class="stimulus-box">
            <div class="stimulus-title">
              <span>${item.stimulusTitle}</span>
              ${item.audioText ? `<button type="button" class="audio-btn" id="play-audio-btn">🔊 Audio anhören</button>` : ""}
            </div>
            <div>${item.stimulusText || ""}</div>
            ${item.audioText ? `
              <details style="margin-top:8px; font-size:0.88rem; color:#475569;">
                <summary style="cursor:pointer; font-weight:600;">Transkript anzeigen (Hilfe)</summary>
                <p style="margin:6px 0 0 0;">${item.audioText}</p>
              </details>
            ` : ""}
          </div>
        `;
      }

      const optionsHtml = item.options.map((opt, idx) => {
        let cls = "option-btn";
        if (answered) {
          if (idx === item.answer) cls += " correct";
          else if (idx === selectedIdx) cls += " wrong";
        }
        return `
          <button type="button" class="${cls}" data-idx="${idx}" ${answered ? "disabled" : ""}>
            <span class="option-letter">${letters[idx]}</span>
            <span>${opt}</span>
          </button>
        `;
      }).join("");

      const isCorrect = answered && selectedIdx === item.answer;
      const feedbackHtml = answered ? `
        <div class="feedback show ${isCorrect ? "ok" : "err"}">
          <strong>${isCorrect ? "✓ Richtig!" : "✗ Leider nicht richtig."}</strong><br/>
          ${item.explanation}
        </div>
      ` : `<div class="feedback" id="feedback"></div>`;

      quizCard.innerHTML = `
        <div class="category-tag">${item.module}</div>
        ${stimulusHtml}
        <h2 class="question-text">${item.q}</h2>
        <div class="options">${optionsHtml}</div>
        ${feedbackHtml}
        <div class="nav-bar">
          <button type="button" class="btn btn-secondary" id="prev-btn" ${currentIndex === 0 ? "disabled" : ""}>← Zurück</button>
          <button type="button" class="btn btn-primary" id="next-btn" ${!answered ? "disabled" : ""}>
            ${currentIndex === filteredQuestions.length - 1 ? "Ergebnis anzeigen →" : "Weiter →"}
          </button>
        </div>
      `;

      const audioBtn = document.getElementById("play-audio-btn");
      if (audioBtn) {
        audioBtn.addEventListener("click", () => speakText(item.audioText));
      }

      document.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (userAnswers.has(item)) return;
          const chosen = Number(btn.dataset.idx);
          userAnswers.set(item, chosen);
          renderQuestion();
        });
      });

      document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentIndex > 0) {
          window.speechSynthesis && window.speechSynthesis.cancel();
          currentIndex--;
          renderQuestion();
        }
      });

      document.getElementById("next-btn").addEventListener("click", () => {
        window.speechSynthesis && window.speechSynthesis.cancel();
        currentIndex++;
        renderQuestion();
      });
    }

    function renderSummary() {
      const total = filteredQuestions.length;
      let correct = 0;
      const byMod = {};

      filteredQuestions.forEach(q => {
        if (!byMod[q.module]) byMod[q.module] = { total: 0, ok: 0 };
        byMod[q.module].total++;
        if (userAnswers.get(q) === q.answer) {
          correct++;
          byMod[q.module].ok++;
        }
      });

      const pct = Math.round((correct / total) * 100);
      let levelMsg = "Guter Start! Wiederholen Sie noch einmal die Erklärungen bei den Fehlern.";
      if (pct >= 85) levelMsg = "Hervorragend! Sie beherrschen Kapitel 4 sicher.";
      else if (pct >= 65) levelMsg = "Sehr solide Leistung! Mit einer kurzen Wiederholung sitzt alles perfekt.";

      const modCards = Object.entries(byMod).map(([mod, data]) => `
        <div class="stat-box">
          <div class="stat-label">${mod}</div>
          <div class="stat-value">${data.ok} / ${data.total}</div>
        </div>
      `).join("");

      quizCard.innerHTML = `
        <div class="category-tag">Auswertung</div>
        <h2 class="question-text">Training abgeschlossen: ${correct} von ${total} Punkten (${pct} %)</h2>
        <p>${levelMsg}</p>
        <div class="summary-grid">${modCards}</div>
        <div class="nav-bar">
          <button type="button" class="btn btn-secondary" id="review-btn">← Aufgaben ansehen</button>
          <button type="button" class="btn btn-primary" id="restart-btn">Neu starten</button>
        </div>
      `;

      document.getElementById("review-btn").addEventListener("click", () => {
        currentIndex = 0;
        renderQuestion();
      });

      document.getElementById("restart-btn").addEventListener("click", () => {
        filteredQuestions.forEach(q => userAnswers.delete(q));
        currentIndex = 0;
        renderQuestion();
      });
    }

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        activeModule = chip.dataset.module;
        filteredQuestions = activeModule === "all"
          ? [...questions]
          : questions.filter(q => q.module === activeModule);
        currentIndex = 0;
        renderQuestion();
      });
    });

    renderQuestion();
  </script>
